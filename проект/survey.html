<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <title>Анкета - Охрид</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>City Explorer: Охрид</h1>
        <nav>
            <ul>
                <li><a href="index.html">Почетна</a></li>
                <li><a href="gallery.html">Галерија</a></li>
                <li><a href="blog.html">Блог</a></li>
                <li><a href="survey.html">Анкета</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="container">
            <h2 class="section-title">Анкета за импресии</h2>
            <form id="surveyForm">
                <label for="name">Вашето име:</label>
                <input type="text" id="name" name="name" required>

                <label for="rating">Како би го оцениле сајтот (1-5)?</label>
                <input type="number" id="rating" name="rating" min="1" max="5" required>

                <label>Што ви се допадна најмногу?</label>
                <input type="checkbox" id="design" name="liked" value="design">
                <label for="design">Дизајн</label><br>
                <input type="checkbox" id="info" name="liked" value="info">
                <label for="info">Информации</label><br>

                <label>Дали би го препорачале сајтот?</label>
                <input type="radio" id="yes" name="recommend" value="yes" required>
                <label for="yes">Да</label>
                <input type="radio" id="no" name="recommend" value="no">
                <label for="no">Не</label>

                <label for="comments">Дополнителни коментари:</label>
                <textarea id="comments" name="comments" rows="4"></textarea>

                <button type="submit">Испрати</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 ФЕИТ - Основи на Web Програмирање.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
